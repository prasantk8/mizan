services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan_owner
      POSTGRES_PASSWORD: local-only-mizan
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan_owner -d mizan"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro

  postgres-demo:
    profiles: ["demo"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan_owner
      POSTGRES_PASSWORD: demo-only-mizan
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan_owner -d mizan"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
      - mizan-demo-data:/var/lib/postgresql/data

volumes:
  mizan-demo-data:
