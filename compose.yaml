services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan_owner
      POSTGRES_PASSWORD: local-only-mizan
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan_owner -d mizan"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro

