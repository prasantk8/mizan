name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and frozen contract
        run: make check

  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint implementation and tests
        run: uv run --frozen ruff check .
      - name: Run unit, invariant, and property tests
        run: uv run --frozen pytest -q tests/unit
      - name: Verify contract coverage references are collected
        run: uv run --frozen python scripts/validate_contract_coverage.py
      - name: Gate execution security module unit coverage
        run: uv run --frozen pytest -q tests/unit/test_execution.py --cov=mizan_control_plane.execution --cov-fail-under=50
      - name: Verify 100k-record chain performance
        env:
          MIZAN_BENCHMARK_RESULTS_DIR: ${{ runner.temp }}/benchmark-results
        run: |
          uv run --frozen python -m benchmarks.chain_verifier
          uv run --frozen python scripts/validate_benchmark_artifacts.py \
            --results-dir "$MIZAN_BENCHMARK_RESULTS_DIR" --require chain-verifier

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate migrations, forced RLS, typed IDs, and immutability
        run: make test-postgres

  offline-evidence-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated two-dependency verifier environment
        run: |
          python -m venv .offline-verifier
          .offline-verifier/bin/pip install rfc8785==0.1.4 cryptography==50.0.0
      - name: Verify committed bundle with the network namespace disabled
        run: |
          openssl version
          openssl ts -help >/dev/null
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/golden/bundle
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/attested/bundle \
            --tsa-trust-anchor tests/fixtures/evidence_export/attested/tsa-root.pem
          # A bundle past its timestamp horizon is EXPIRED (exit 4), not FAIL (exit 1), and the
          # rest of it still verifies. This fixture can never be un-expired: see its README.
          if sudo unshare --net -- .offline-verifier/bin/python \
              scripts/verify_evidence_export.py tests/fixtures/evidence_export/expired/bundle \
              --tsa-trust-anchor tests/fixtures/evidence_export/expired/tsa-root.pem
          then expired_status=0; else expired_status=$?; fi
          test "$expired_status" -eq 4 || {
            echo "expected EXPIRED (exit 4) for the expired fixture, got $expired_status" >&2
            exit 1
          }
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/public-tsa/bundle \
            --tsa-trust-anchor tests/fixtures/evidence_export/public-tsa/freetsa-root.pem \
            --tsa-trust-anchor tests/fixtures/evidence_export/public-tsa/usertrust-rsa-root.pem
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/check_evidence_conformance.py
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/check_evidence_mutations.py

  implementation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce claim and handoff provenance per commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$EVENT_BEFORE"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            python3 scripts/validate_claim_ledger.py --head HEAD
          else
            python3 scripts/validate_claim_ledger.py --base "$base" --head HEAD
          fi
