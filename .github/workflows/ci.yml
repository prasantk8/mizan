name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository and frozen contract
        run: make check

  implementation-gates:
    if: ${{ false }} # Enabled by T-014 once claim/change-set enforcement exists.
    runs-on: ubuntu-latest
    steps:
      - run: echo "T-014 will replace this placeholder with lane-aware checks"

