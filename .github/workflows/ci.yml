name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # `make check` reads a declared dependency (jsonschema) that a bare interpreter does not
      # have. This job used to have no install step at all and passed only in the imagination
      # of the people running it on a laptop. R-008 F-8.
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate repository and frozen contract
        run: make check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # R-005 F-18: this repository has drift gates and no anti-rot gates. Everything here can be
      # weakened by subtraction without one assertion going red -- delete a job, shrink the
      # corpus, drop a fault category, and the build goes green faster with nobody told anything.
      - name: The gates only ratchet upward
        run: uv run --frozen python scripts/validate_gate_inventory.py

  installed-console-scripts:
    # Every test in this repository runs with `sdk/python` and `integrations/mcp` on `sys.path`,
    # courtesy of `tool.pytest.ini_options.pythonpath`. That makes packaging defects structurally
    # invisible to the test suite: `mizan-mcp-gateway`, Track B's headline deliverable, was
    # declared from the day it landed and had never once started outside pytest. Only an
    # installation can catch this, so this job builds the wheels and runs them.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Every declared console script starts from an installation
        run: uv run python scripts/verify_console_scripts.py

  deployment-manifests:
    # `test_packaging.py` asserted substrings over the Dockerfile, compose, values.yaml and the
    # migration job, and passed throughout the period in which neither `helm install` nor
    # `docker compose --profile production up` could start Mizan at all. No `helm lint` or
    # `helm template` ran anywhere. This job renders the chart with a digest-pinned Helm and
    # resolves every entrypoint the manifests launch against the console scripts the project
    # actually declares, then launches production Compose against PostgreSQL, TLS Vault Transit,
    # and an Object Lock bucket and reaches /readyz over mTLS. Rendering alone is the general form
    # of T-099; booting catches required dependencies that the image or environment omitted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Render every manifest and boot production Compose to readiness
        run: uv run --frozen python scripts/validate_deployment_manifests.py

  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Lint implementation and tests
        run: uv run --frozen ruff check .
      - name: Run unit, invariant, and property tests
        run: uv run --frozen pytest -q tests/unit
      # `tests/integration` is not collected anywhere by directory: the PostgreSQL modules run in
      # `postgres-contract` from an explicit inventory, and Vault/Object Lock/production boot are
      # each named by the job that provisions their dependency. T-136's MCP forwarding test needs
      # none of that -- it drives a real MCP session over in-memory streams -- so it landed in a
      # directory no job reads and had never executed in CI. Named here rather than switched to a
      # directory sweep, because a sweep would drag the PostgreSQL modules into a job with no
      # database and fail for a reason unrelated to the code under test.
      - name: Run the in-process integration tests that need no external service
        run: uv run --frozen pytest -q tests/integration/test_mcp_proof_forwarding.py
      - name: Run the identity verification key rotation drill
        run: uv run --frozen python scripts/identity_key_rotation_drill.py
      - name: Verify contract coverage references are collected
        run: uv run --frozen python scripts/validate_contract_coverage.py
      - name: Gate control-plane unit coverage
        run: uv run --frozen pytest -q tests/unit --cov=mizan_control_plane --cov-fail-under=62
      - name: Gate identity and route coverage
        run: |
          uv run --frozen pytest -q tests/unit/test_app_routes.py tests/unit/test_dev_token.py \
            tests/unit/test_identity_key_rotation.py \
            --cov=mizan_control_plane.auth --cov-fail-under=75
          uv run --frozen pytest -q tests/unit/test_app_routes.py tests/unit/test_runtime.py \
            --cov=mizan_control_plane.app --cov-fail-under=68
      - name: Reproduce the CP-B attestation review
        run: uv run --frozen python docs/reviews/reproductions/R-007-cpb-attestation.py
      - name: Verify 100k-record chain performance
        env:
          MIZAN_BENCHMARK_RESULTS_DIR: ${{ runner.temp }}/benchmark-results
        run: |
          uv run --frozen python -m benchmarks.chain_verifier
          uv run --frozen python scripts/validate_benchmark_artifacts.py \
            --results-dir "$MIZAN_BENCHMARK_RESULTS_DIR" --require chain-verifier

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate migrations and run all nine PostgreSQL integration modules
        env:
          CI: "true"
        run: make test-postgres

  adversarial-fault-injection:
    # R-008 F-3: .regression was a marker file no workflow ever wrote, so "each
    # adversarial category can go red" was asserted in a docstring and
    # demonstrated by nobody. This job reverts one real guard per category and
    # requires every one of them to fail. It runs its own PostgreSQL rather than
    # sharing postgres-contract's, so a fault applied here can never leak into
    # that job's assertions.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Start PostgreSQL and provision the schema
        run: |
          compose=(docker compose -f compose.yaml -f compose.test.yaml -p mizan-adversarial-faults)
          "${compose[@]}" up -d --wait postgres
          "${compose[@]}" exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U mizan_owner -d mizan < tests/integration/postgres/schema_contract.sql
          "${compose[@]}" exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U mizan_owner -d mizan -c "ALTER ROLE mizan_app LOGIN PASSWORD 'integration-only-mizan'"
          published_port="$("${compose[@]}" port postgres 5432 | awk -F: '{print $NF}')"
          echo "MIZAN_TEST_DATABASE_URL=postgresql://mizan_app:integration-only-mizan@127.0.0.1:${published_port}/mizan" >> "$GITHUB_ENV"
      - name: Apply each adversarial fault and require the suite to go red
        run: uv run --frozen python scripts/adversarial_fault_injection.py
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml -p mizan-adversarial-faults down --volumes

  vault-transit:
    # T-102's gate, and the work order forbids a mock here: "a mocked key backend in a stage whose
    # thesis is 'the gate must reproduce the result' would be self-refuting". So this is a real
    # Vault, provisioned by the script an operator runs, signing with a real Ed25519 key it will
    # not release. Its own job because it is the only one that needs Vault, and because a key
    # backend that stops being exercised is a key backend that stops working.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      vault:
        image: hashicorp/vault:1.18@sha256:750bb37c1638fa194ab37053a81618c61bb0491ddec6fccac87c07a8e6cd8166
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-only-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "wget -q -O- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Provision Transit with the script operators run
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: ci-only-root
        run: bash scripts/provision_vault.sh
      - name: Sign, verify and rotate against the real Vault
        env:
          MIZAN_TEST_VAULT_ADDR: http://127.0.0.1:8200
          MIZAN_TEST_VAULT_TOKEN: ci-only-root
        run: |
          # Skipped is not passed. This file skips itself when Vault is unconfigured, so a job
          # whose service container failed to come up would otherwise go green having executed
          # nothing -- the exact failure mode R-008 F-11 and T-035 exist to catch, in the newest
          # place it could appear. The check reads the *run* summary rather than a collected
          # count: collection cannot tell a test that ran from one that was skipped, and a count
          # would make this job fail every time someone adds a test.
          if ! output=$(uv run --frozen pytest -q tests/integration/test_vault_transit_live.py 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          summary=$(printf '%s\n' "$output" | tail -1)
          case "$summary" in
            *skipped*|*"no tests ran"*)
              echo "::error::the Vault suite did not run against a real Vault: $summary"
              exit 1
              ;;
          esac

  evidence-object-lock:
    # T-104 / B-21. `"retention_class": "regulatory_7y"` is a string this system signs into records,
    # and until now the only thing behind it was a directory the chart mounted as an `emptyDir`
    # under `replicaCount: 2`. Tested against a real S3 implementation rather than a double,
    # because the guarantee *is* the implementation: a mock that refuses a delete proves only that
    # a mock refuses a delete.
    #
    # MinIO runs as a step rather than a service for the same reason Vault does -- its image needs
    # the `server /data` command, and a `services:` block cannot override one.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Start an S3-compatible store that supports Object Lock
        run: |
          docker run -d --name mizan-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=mizan-ci-access \
            -e MINIO_ROOT_PASSWORD=mizan-ci-secret-key \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null
      - name: Write, lock, and fail to delete
        env:
          MIZAN_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
          MIZAN_TEST_S3_ACCESS_KEY_ID: mizan-ci-access
          MIZAN_TEST_S3_SECRET_ACCESS_KEY: mizan-ci-secret-key
        run: |
          # Skipped is not passed (R-008 F-11): this file skips itself without an endpoint, so a
          # job whose store failed to start would go green having proved nothing.
          if ! output=$(uv run --frozen pytest -q tests/integration/test_object_lock_store.py 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          case "$(printf '%s\n' "$output" | tail -1)" in
            *skipped*|*"no tests ran"*)
              echo "::error::the Object Lock suite did not run against a real object store"
              exit 1
              ;;
          esac
      - name: Stop the object store
        if: always()
        run: docker rm -f mizan-ci-minio || true

  production-boot:
    # T-101. Every other production assertion in this repository is a *refusal*, and a complete set
    # of refusals with nothing left that starts is indistinguishable from a system that refuses
    # everything. CI's only container boot passes `--env MIZAN_ENV=development`, so `app.py`'s
    # production readiness branch had never executed anywhere.
    #
    # Vault runs as a step rather than a service because production requires https:// to Vault and
    # a `services:` block cannot override the image command, which is what `-dev-tls` needs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: mizan
          POSTGRES_USER: mizan_owner
          POSTGRES_PASSWORD: integration-only-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan_owner -d mizan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Provision the schema and the runtime login
        env:
          PGPASSWORD: integration-only-owner
        run: |
          # A `services:` PostgreSQL has no `docker-entrypoint-initdb.d` mount, so the migrations
          # have to be applied here -- `schema_contract.sql` only *asserts* the tables exist and
          # fails with "28 required tables missing" against an empty database. Globbed rather than
          # listed so a new migration is applied without editing this file, which is how migration
          # 0004 came to be absent from a gate that claimed to provision the schema.
          for migration in $(ls infra/postgres/migrations/*.sql | sort); do
            psql --host 127.0.0.1 --username mizan_owner --dbname mizan --set ON_ERROR_STOP=1 \
              --quiet --file "$migration"
          done
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan --set ON_ERROR_STOP=1 \
            --file tests/integration/postgres/schema_contract.sql
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan --set ON_ERROR_STOP=1 \
            --command "ALTER ROLE mizan_app LOGIN PASSWORD 'integration-only-mizan'"
      - name: Start Vault with TLS
        run: |
          # `mkdir` inside the container: `-dev-tls` refuses a cert directory that does not exist,
          # and panics on one bind-mounted from the host because it tries to remove files that are
          # not there. Certificates are copied out afterwards rather than shared in.
          docker run -d --name mizan-ci-vault --cap-add=IPC_LOCK -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=ci-only-root --entrypoint sh \
            hashicorp/vault:1.18@sha256:750bb37c1638fa194ab37053a81618c61bb0491ddec6fccac87c07a8e6cd8166 \
            -c 'mkdir -p /vault-tls && exec vault server -dev -dev-tls \
                -dev-listen-address=0.0.0.0:8200 -dev-tls-cert-dir=/vault-tls'
          for _ in $(seq 1 30); do
            if docker exec mizan-ci-vault test -f /vault-tls/vault-ca.pem; then break; fi
            sleep 1
          done
          docker cp mizan-ci-vault:/vault-tls/vault-ca.pem "$RUNNER_TEMP/vault-ca.pem"
          curl -sS --cacert "$RUNNER_TEMP/vault-ca.pem" \
            -H "X-Vault-Token: ci-only-root" https://127.0.0.1:8200/v1/sys/health > /dev/null
      - name: Provision Transit with the script operators run
        env:
          VAULT_ADDR: https://127.0.0.1:8200
          VAULT_TOKEN: ci-only-root
        run: VAULT_CACERT="$RUNNER_TEMP/vault-ca.pem" bash scripts/provision_vault.sh
      - name: Start an S3-compatible store with Object Lock
        run: |
          # Production refuses a directory for evidence (B-21), so booting production needs a real
          # bucket. A gate that booted onto an emptyDir would prove that the configuration we
          # refuse to ship still starts.
          docker run -d --name mizan-boot-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=mizan-ci-access \
            -e MINIO_ROOT_PASSWORD=mizan-ci-secret-key \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null
      - name: Boot the control plane with MIZAN_ENV=production
        env:
          MIZAN_TEST_DATABASE_URL: postgresql://mizan_app:integration-only-mizan@127.0.0.1:5432/mizan
          MIZAN_TEST_VAULT_ADDR: https://127.0.0.1:8200
          MIZAN_TEST_VAULT_TOKEN: ci-only-root
          MIZAN_TEST_S3_ENDPOINT_URL: http://127.0.0.1:9000
          MIZAN_TEST_S3_ACCESS_KEY_ID: mizan-ci-access
          MIZAN_TEST_S3_SECRET_ACCESS_KEY: mizan-ci-secret-key
        run: |
          export MIZAN_TEST_VAULT_CA_CERT="$RUNNER_TEMP/vault-ca.pem"
          # Skipped is not passed: this file skips itself without a database and a Vault, so a job
          # that lost either would go green having proved nothing (R-008 F-11).
          if ! output=$(uv run --frozen pytest -q tests/integration/test_production_boot.py 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          case "$(printf '%s\n' "$output" | tail -1)" in
            *skipped*|*"no tests ran"*)
              echo "::error::production boot did not run against a real database and Vault"
              exit 1
              ;;
          esac
      - name: Stop Vault and the object store
        if: always()
        run: docker rm -f mizan-ci-vault mizan-boot-minio || true

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: mizan
          POSTGRES_USER: mizan_owner
          POSTGRES_PASSWORD: integration-only-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan_owner -d mizan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Build the pinned non-root image
        run: docker build --tag "mizan-control-plane:${GITHUB_SHA}" .
      - name: Provision exactly migration 0001
        env:
          PGPASSWORD: integration-only-owner
        run: >-
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan
          --set ON_ERROR_STOP=1 --file infra/postgres/migrations/0001_domain_schema.sql
      - name: Upgrade 0001 through the image migration job
        run: >-
          docker run --rm --network host
          --env MIZAN_MIGRATION_DATABASE_URL=postgresql://mizan_owner:integration-only-owner@127.0.0.1:5432/mizan
          --entrypoint python "mizan-control-plane:${GITHUB_SHA}" /app/scripts/migrate.py
      - name: Assert migration history and provision the runtime login
        env:
          PGPASSWORD: integration-only-owner
        run: |
          # Counted against the migration directory rather than a literal, so adding a migration
          # cannot pass this gate by being forgotten -- it was `= "3"` and 0004 made it wrong.
          expected="$(ls infra/postgres/migrations/*.sql | wc -l | tr -d ' ')"
          test "$(psql --host 127.0.0.1 --username mizan_owner --dbname mizan --tuples-only --no-align --command 'SELECT count(*) FROM mizan.schema_migrations')" = "$expected"
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan --set ON_ERROR_STOP=1 --command "ALTER ROLE mizan_app LOGIN PASSWORD 'integration-only-app'"
      - name: Boot the container and require readiness 200
        run: |
          docker run --detach --name mizan-package-gate --network host \
            --env MIZAN_DATABASE_URL=postgresql://mizan_app:integration-only-app@127.0.0.1:5432/mizan \
            --env MIZAN_JWT_ISSUER=urn:mizan:development:package-gate \
            --env 'MIZAN_IDENTITY_JWKS={"keys":[{"alg":"EdDSA","crv":"Ed25519","kid":"unused","kty":"OKP","use":"sig","x":"O-cX0g0xmFjyu_3CjAJd4swlM1Caf0u_X4JNwl6nEHs"}]}' \
            --env MIZAN_ENV=development \
            --env MIZAN_HTTP_HOST=0.0.0.0 \
            "mizan-control-plane:${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.User}}' mizan-package-gate)" = "65532:65532"
          docker exec mizan-package-gate openssl version
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >ready.json; then
              break
            fi
            sleep 1
          done
          test "$(python3 -c 'import json; print(json.load(open("ready.json"))["status"])')" = "ready"
      - name: Validate dated vulnerability exceptions
        # R-008 F-5: --enforce-expiry is deliberate here and nowhere else. This
        # is the job with a live CVE database in front of it; make check runs
        # the same validator without the flag and only warns.
        run: python3 scripts/validate_vulnerability_allowlist.py --enforce-expiry
      - name: Generate CycloneDX SBOM
        run: >-
          docker run --rm --user 0:0 --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "${PWD}:/output"
          anchore/syft:v1.29.0@sha256:e86b0ba0b1d2fe8a2e9f96ed9b22033df9781f43b9a7eb27c57e6c89234946bc
          "mizan-control-plane:${GITHUB_SHA}" --output cyclonedx-json=/output/mizan-sbom.cdx.json
      - name: Scan HIGH and CRITICAL vulnerabilities
        id: vulnerability_scan
        continue-on-error: true
        run: >-
          docker run --rm --user 0:0 --volume /var/run/docker.sock:/var/run/docker.sock
          --volume "${PWD}:/workspace" aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --ignorefile /workspace/infra/supply-chain/.trivyignore.yaml
          --scanners vuln --skip-version-check --severity HIGH,CRITICAL --exit-code 1 --format json
          --output /workspace/mizan-trivy.json "mizan-control-plane:${GITHUB_SHA}"
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-evidence-${{ github.sha }}
          path: |
            mizan-sbom.cdx.json
            mizan-trivy.json
          if-no-files-found: error
      - name: Enforce vulnerability result
        if: steps.vulnerability_scan.outcome == 'failure'
        run: exit 1
      - name: Remove package gate container
        if: always()
        run: docker rm --force mizan-package-gate 2>/dev/null || true

  offline-evidence-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated two-dependency verifier environment
        run: |
          python -m venv .offline-verifier
          .offline-verifier/bin/pip install rfc8785==0.1.4 cryptography==50.0.0
      - name: Verify committed bundle with the network namespace disabled
        run: |
          openssl version
          openssl ts -help >/dev/null
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/golden/bundle
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/attested/bundle \
            --tsa-trust-anchor tests/fixtures/evidence_export/attested/tsa-root.pem
          # A bundle past its timestamp horizon is EXPIRED (exit 4), not FAIL (exit 1), and the
          # rest of it still verifies. This fixture can never be un-expired: see its README.
          if sudo unshare --net -- .offline-verifier/bin/python \
              scripts/verify_evidence_export.py tests/fixtures/evidence_export/expired/bundle \
              --tsa-trust-anchor tests/fixtures/evidence_export/expired/tsa-root.pem
          then expired_status=0; else expired_status=$?; fi
          test "$expired_status" -eq 4 || {
            echo "expected EXPIRED (exit 4) for the expired fixture, got $expired_status" >&2
            exit 1
          }
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py tests/fixtures/evidence_export/public-tsa/bundle \
            --tsa-trust-anchor tests/fixtures/evidence_export/public-tsa/freetsa-root.pem \
            --tsa-trust-anchor tests/fixtures/evidence_export/public-tsa/usertrust-rsa-root.pem
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/check_evidence_conformance.py
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/check_evidence_mutations.py
      # Section 2.1's cross-anchored Memtara proofs. Both verifiers have carried this code since
      # T-135 landed the format change and nothing in CI had ever run a single line of it: no
      # fixture anywhere held an `external_proofs` member, and this job passed no
      # `--memtara-trust-root`. The fixtures below are built and re-signed end to end by
      # `scripts/build_memtara_fixtures.py`, so the tampered one reaches the proof-binding check
      # instead of stopping at the manifest digest.
      #
      # Each verifier's exit status is asserted **separately** rather than only through
      # `compare_verifiers.py`. The differential gate proves the two agree; it cannot prove they
      # are both right, and two implementations that skipped the same check would agree perfectly.
      - name: The Memtara trust root turns a proof-bearing bundle from CANNOT CHECK into VALID
        run: |
          bundle=tests/fixtures/conformance/valid-memtara-proof
          root=tests/fixtures/conformance/memtara-trust-root.jwks.json
          sudo unshare --net -- .offline-verifier/bin/python \
            scripts/verify_evidence_export.py "$bundle" --memtara-trust-root "$root"
          # The same bytes, no operator root. Section 2.1: Memtara keys MUST NOT come from the
          # bundle, so an unevaluable proof is CANNOT CHECK (exit 2) and never INVALID.
          if sudo unshare --net -- .offline-verifier/bin/python \
              scripts/verify_evidence_export.py "$bundle"
          then rootless_status=0; else rootless_status=$?; fi
          test "$rootless_status" -eq 2 || {
            echo "expected CANNOT CHECK (exit 2) without a Memtara root, got $rootless_status" >&2
            exit 1
          }
      - name: A proof_hash the signed Memtara token does not state is INVALID in the reference verifier
        run: |
          bundle=tests/fixtures/conformance/invalid-memtara-proof-binding
          root=tests/fixtures/conformance/memtara-trust-root.jwks.json
          if sudo unshare --net -- .offline-verifier/bin/python \
              scripts/verify_evidence_export.py "$bundle" --memtara-trust-root "$root"
          then python_status=0; else python_status=$?; fi
          test "$python_status" -eq 1 || {
            echo "reference verifier: expected INVALID (exit 1), got $python_status" >&2
            exit 1
          }
      - name: A record carrying external_proofs under a 1.0 manifest is MALFORMED
        run: |
          bundle=tests/fixtures/conformance/malformed-memtara-in-1.0
          root=tests/fixtures/conformance/memtara-trust-root.jwks.json
          if sudo unshare --net -- .offline-verifier/bin/python \
              scripts/verify_evidence_export.py "$bundle" --memtara-trust-root "$root"
          then malformed_status=0; else malformed_status=$?; fi
          test "$malformed_status" -eq 3 || {
            echo "expected MALFORMED (exit 3) for external_proofs under bundle 1.0, got $malformed_status" >&2
            exit 1
          }
      # `verifier-two/` has existed since T-062 and CI has never run it. It was written from the
      # specification alone, under a seal, precisely so its verdicts could be diffed against the
      # reference -- and until now that diff was a thing a human did once, by hand, and wrote up.
      # Node 20+ and zero dependencies: an auditor's environment, not a build environment.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: verifier-two's own suite
        # A suite CI had never run at all. `node --test` resolves its own test directory, so this
        # runs from the package root exactly as its `npm test` script does.
        run: cd verifier-two && node --test
      # The independent verifier's own exit statuses over the same Memtara fixtures. The
      # reference verifier was asserted above; this is the other half of "each verifier
      # separately", and it is a separate assertion from the differential gate below on purpose.
      - name: verifier-two reaches all four Memtara verdicts on its own
        run: |
          root=tests/fixtures/conformance/memtara-trust-root.jwks.json
          run_two() {
            if sudo unshare --net -- node verifier-two/bin/mizan-verify-two.js "$@" >/dev/null
            then echo 0; else echo $?; fi
          }
          status=$(run_two tests/fixtures/conformance/valid-memtara-proof --memtara-trust-root "$root")
          test "$status" -eq 0 || { echo "verifier-two: expected VALID (0), got $status" >&2; exit 1; }
          status=$(run_two tests/fixtures/conformance/valid-memtara-proof)
          test "$status" -eq 2 || { echo "verifier-two: expected CANNOT CHECK (2), got $status" >&2; exit 1; }
          status=$(run_two tests/fixtures/conformance/invalid-memtara-proof-binding --memtara-trust-root "$root")
          test "$status" -eq 1 || { echo "verifier-two: expected INVALID (1), got $status" >&2; exit 1; }
          status=$(run_two tests/fixtures/conformance/malformed-memtara-in-1.0 --memtara-trust-root "$root")
          test "$status" -eq 3 || { echo "verifier-two: expected MALFORMED (3), got $status" >&2; exit 1; }
      - name: Both verifiers agree on every conformance bundle
        # Offline like every other check in this job: an auditor verifies a bundle with the
        # network off, and a comparison that needed the network would not be comparing what they
        # would run. No fallback -- a gate with an escape hatch is not a gate.
        run: |
          sudo unshare --net -- .offline-verifier/bin/python scripts/compare_verifiers.py

  implementation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce claim and handoff provenance per commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$EVENT_BEFORE"
          fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            python3 scripts/validate_claim_ledger.py --head HEAD
          else
            python3 scripts/validate_claim_ledger.py --base "$base" --head HEAD
          fi

  # `completion-report` moved to .github/workflows/completion-report.yml on 2026-09-02. It is the
  # one gate whose subject is the pull request body rather than the commit, so it needs the
  # `edited` trigger that `on: pull_request` does not include by default -- and giving that trigger
  # to this whole workflow would rebuild Docker images and start a Vault every time a description
  # is corrected. The required check name is unchanged.
