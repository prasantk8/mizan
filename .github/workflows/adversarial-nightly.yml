name: Nightly adversarial suite

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: mizan
          POSTGRES_USER: mizan_owner
          POSTGRES_PASSWORD: adversarial-only-owner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizan_owner -d mizan"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: "true"
      MIZAN_TEST_DATABASE_URL: postgresql://mizan_app:adversarial-only-app@127.0.0.1:5432/mizan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply the production migrations and seed both tenants
        env:
          PGPASSWORD: adversarial-only-owner
        run: |
          for migration in infra/postgres/migrations/*.sql; do
            psql --host 127.0.0.1 --username mizan_owner --dbname mizan \
              --set ON_ERROR_STOP=1 --file "$migration"
          done
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan \
            --set ON_ERROR_STOP=1 --file tests/integration/postgres/schema_contract.sql
          psql --host 127.0.0.1 --username mizan_owner --dbname mizan \
            --set ON_ERROR_STOP=1 \
            --command "ALTER ROLE mizan_app LOGIN PASSWORD 'adversarial-only-app'"
      - name: Run every adversarial category against PostgreSQL
        run: uv run --frozen pytest -q tests/adversarial
