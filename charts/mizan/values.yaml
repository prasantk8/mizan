image:
  repository: ghcr.io/example/mizan-control-plane
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8443

secrets:
  runtime: mizan-runtime
  appDatabaseUrlKey: app-database-url
  ownerDatabaseUrlKey: owner-database-url
  identityJwksKey: identity-jwks
  tls: mizan-tls

config:
  jwtIssuer: https://identity.example.invalid
  jwtAudience: mizan-control-plane
  executionTokenIssuer: https://mizan.example.invalid
  evaluatorBuild: "replace-with-release-id"
  evaluatorConfigurationHash: "replace-with-64-hex-characters"
  # `kms` named no backend and `kms://` no parser -- this chart rendered a deployment that could
  # not start. B-18 chose Vault Transit; `scripts/provision_vault.sh` prints these values.
  keyCustodyMode: vault-transit
  evidenceReceiptKeyRef: vault://transit/mizan-evidence-receipt#v1
  evidenceAnchorKeyRef: vault://transit/mizan-evidence-anchor#v1
  executionTokenKeyRef: vault://transit/mizan-execution-token#v1
  degradedGrantKeyRef: vault://transit/mizan-degraded-grant#v1
  # The fifth key role and the only MAC one (ADR-004 G.1 as amended by B-30, T-054). A Transit key
  # of type `hmac`; the adapter refuses to commit under an `ed25519` key, so pointing this at one of
  # the four above fails at startup rather than silently reusing an evidence signing key.
  auditCommitmentKeyRef: vault://transit/mizan-audit-commitment#v1
  vaultAddr: ""                              # required; https:// in production
  vaultTokenFile: /run/mizan/vault/token     # a Secret mount or a Vault Agent sink
  # Evidence durability (B-21). `local` is a directory and production refuses it: a directory
  # cannot enforce the retention every signed record already claims, and the `emptyDir` this
  # replaces lost the corpus on every rollout.
  evidenceObjectStore: s3
  auditAnchorBucket: ""                      # required; must be created with Object Lock enabled
  s3EndpointUrl: ""                          # empty for AWS S3; set for an S3-compatible endpoint
  s3Region: us-east-1
  objectLockRetentionYears: 7
  tsaEndpoints: https://tsa.example.invalid

drainer:
  # On by default, and the same reasoning as the compose profile: without this workload no
  # evidence receipt is ever written, and `execution.py::_require_receipts` then refuses every
  # `financial_write` with 403 immutable_receipt_missing. A chart that installs a Mizan which
  # cannot execute a payment is not a smaller Mizan, it is a broken one.
  enabled: true
  replicaCount: 1
  # Tenants cannot be discovered: mizan.tenants is under FORCE ROW LEVEL SECURITY and the schema
  # has no SECURITY DEFINER function. Widening that is an H-7 tenant-isolation call, escalated as
  # B-27. Until it is ruled on, name the tenants this drainer serves.
  tenants: []

attestation:
  # On by default for the reason the drainer is: `mizan-attest-anchors` appeared in no manifest
  # at all, so every anchor stayed `pending` forever and the RFC 3161 timestamp that is this
  # product's central claim was never obtained on any deployment. B-12 forbids calling such a
  # stream externally anchored, so a Mizan without this workload cannot honestly make the claim
  # it exists to make.
  enabled: true
  # Same B-27 constraint as the drainer, and a separate key so one workload's served set cannot
  # silently become the other's.
  tenants: []

resources: {}
