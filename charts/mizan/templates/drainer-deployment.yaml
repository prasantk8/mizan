{{- if .Values.drainer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mizan.fullname" . }}-drainer
  labels:
    {{- include "mizan.labels" . | nindent 4 }}
    app.kubernetes.io/component: drainer
spec:
  replicas: {{ .Values.drainer.replicaCount }}
  selector:
    matchLabels:
      {{- include "mizan.labels" . | nindent 6 }}
      app.kubernetes.io/component: drainer
  template:
    metadata:
      labels:
        {{- include "mizan.labels" . | nindent 8 }}
        app.kubernetes.io/component: drainer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: drainer
          image: {{ include "mizan.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mizan-drain-outbox"]
          env:
            - {name: MIZAN_ENV, value: production}
            - name: MIZAN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime }}
                  key: {{ .Values.secrets.appDatabaseUrlKey }}
            # This pod previously received MIZAN_ENV and MIZAN_DATABASE_URL and nothing else,
            # which was survivable only while the binary it launches did not exist. The worker
            # signs a receipt per published record and a payload per anchor, so `Settings` and
            # `build_key_provider` need the custody mode and all four key references or it exits
            # 78 before its first cycle. The evidence volume and TLS material are deliberately
            # still absent: those ride on B-21 under T-104, and this pod does not serve traffic.
            - {name: MIZAN_KEY_CUSTODY_MODE, value: {{ .Values.config.keyCustodyMode | quote }}}
            - {name: MIZAN_EVIDENCE_OBJECT_STORE, value: {{ .Values.config.evidenceObjectStore | quote }}}
            - {name: MIZAN_AUDIT_ANCHOR_BUCKET, value: {{ .Values.config.auditAnchorBucket | quote }}}
            - {name: MIZAN_S3_ENDPOINT_URL, value: {{ .Values.config.s3EndpointUrl | quote }}}
            - {name: MIZAN_S3_REGION, value: {{ .Values.config.s3Region | quote }}}
            - {name: MIZAN_OBJECT_LOCK_RETENTION_YEARS, value: {{ .Values.config.objectLockRetentionYears | quote }}}
            - {name: MIZAN_VAULT_ADDR, value: {{ .Values.config.vaultAddr | quote }}}
            - {name: MIZAN_VAULT_TOKEN_FILE, value: {{ .Values.config.vaultTokenFile | quote }}}
            - {name: MIZAN_EVIDENCE_RECEIPT_KEY_REF, value: {{ .Values.config.evidenceReceiptKeyRef | quote }}}
            - {name: MIZAN_EVIDENCE_ANCHOR_KEY_REF, value: {{ .Values.config.evidenceAnchorKeyRef | quote }}}
            - {name: MIZAN_EXECUTION_TOKEN_SIGNING_KEY_REF, value: {{ .Values.config.executionTokenKeyRef | quote }}}
            - {name: MIZAN_DEGRADED_GRANT_SIGNING_KEY_REF, value: {{ .Values.config.degradedGrantKeyRef | quote }}}
            - {name: MIZAN_AUDIT_HMAC_KEY_REF, value: {{ .Values.config.auditCommitmentKeyRef | quote }}}
            - {name: MIZAN_ANCHOR_PROVIDER, value: rfc3161}
            - {name: MIZAN_ANCHOR_TSA_ENDPOINTS, value: {{ .Values.config.tsaEndpoints | quote }}}
            - {name: MIZAN_ANCHOR_TSA_TRUST_ANCHORS, value: /run/mizan/tls/tsa-root.pem}
            - {name: MIZAN_DRAIN_TENANTS, value: {{ join "," .Values.drainer.tenants | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
{{- end }}
