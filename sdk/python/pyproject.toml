[project]
name = "mizan-sdk"
version = "0.1.0"
description = "Client for the Mizan governance control plane"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mizan"]
