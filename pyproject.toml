[project]
name = "mizan-control-plane"
version = "0.1.0"
description = "Governance control plane for regulated autonomous agents"
requires-python = ">=3.12"
dependencies = [
  "cedarpy==4.8.7",
  # Reads the RFC 3161 signer certificate so an attestation can declare when it stops verifying.
  # Was already present transitively through pyjwt[crypto]; named here because the evidence plane
  # now depends on it directly and a transitive pin is not a dependency decision.
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema[format]>=4.23,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "pyjwt[crypto]>=2.10,<3",
  "rfc8785>=0.1.4,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mizan-control-plane = "mizan_control_plane.__main__:main"
mizan-dev-token = "mizan_control_plane.dev_token:main"
mizan-export-evidence = "mizan_control_plane.evidence_export:main"
mizan-attest-anchors = "mizan_control_plane.attestation_runner:main"
mizan-drain-outbox = "mizan_control_plane.drain_worker:main"
mizan-mcp-gateway = "mizan_mcp_gateway.__main__:main"

[project.optional-dependencies]
# `mizan_mcp_gateway.governance` imports `mizan` (the `mizan-sdk` distribution) at module import,
# so the gateway cannot start without it. It was reachable only because pytest's `pythonpath`
# below puts `sdk/python` on `sys.path`; nothing declared it, so no installation ever had it.
mcp = ["mcp>=2.1,<3", "mizan-sdk"]

# Span *export* is optional; W3C trace propagation and the trace ids written into every
# ADR_Record are not, and need no dependency at all. An operator who sets
# MIZAN_OTEL_EXPORTER_OTLP_ENDPOINT without installing this extra is refused at startup
# rather than served a process that silently exports nothing.
otel = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.uv.sources]
mizan-sdk = { path = "sdk/python" }

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mcp>=2.1,<3",
  "opentelemetry-sdk>=1.30,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  # `scripts/validate_deployment_manifests.py` parses compose and `helm template` output as
  # documents rather than text. It was already installed transitively; a transitive pin is not
  # a dependency decision, and a gate whose parser can vanish is not a gate.
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["control-plane", "security", "integrations", "integrations/mcp", "sdk/python", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `mizan_mcp_gateway` is deliberately absent from `packages` and force-included below.
# `packages` derives one source-strip prefix per entry, and hatchling sorts those prefixes
# (`BuilderConfig.sources` ends in `dict(sorted(...))`), so `integrations/` is always tried
# before `integrations/mcp/` and always matches first. Listing the gateway here stripped only
# `integrations/`, shipping it as a top-level `mcp/` package: unimportable as
# `mizan_mcp_gateway`, so `mizan-mcp-gateway` could not start, and shadowing the `mcp`
# distribution this project itself depends on. Ordering the sources by hand does not help --
# the sort discards the order. force-include bypasses source stripping entirely.
packages = [
  "control-plane/mizan_control_plane",
  "security/mizan_security",
  "integrations/mizan_integrations",
]

[tool.hatch.build.targets.wheel.force-include]
"integrations/mcp/mizan_mcp_gateway" = "mizan_mcp_gateway"
